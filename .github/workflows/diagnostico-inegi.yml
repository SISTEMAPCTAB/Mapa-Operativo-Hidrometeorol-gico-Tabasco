name: Diagnosticar descargas INEGI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-inegi.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identificar cuencas RH30 y descargas
        run: |
          python - <<'PY'
          import requests
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.inegi.org.mx/app/biblioteca/"})
          api="https://www.inegi.org.mx/app/api/productos/interna_v2/ficha/datos"
          for n in range(6938,6950):
              upc="70282500"+str(n)
              r=s.get(api,params={"upc":upc,"lang":"false"},timeout=20)
              if not r.ok: continue
              try:d=r.json()
              except:continue
              if not d.get("success"): continue
              info=d.get("info") or {}
              gen=info.get("generales") or {}
              title=gen.get("titulo") or ""
              if "Red hidrográfica" not in title: continue
              print("UPC",upc,"TITLE",title)
              multi=info.get("multiarchivos") or []
              for parent in multi:
                  for ch in parent.get("hijos") or []:
                      print(" CHILD",ch.get("descrip"),"URL",ch.get("url"))
          PY
