name: Diagnosticar descargas INEGI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-inegi.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar API de Biblioteca INEGI
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.inegi.org.mx/app/biblioteca/"})
          for upc in ["702825006939","702825006943","889463130314"]:
              url="https://www.inegi.org.mx/app/api/productos/interna_v2/ficha/datos"
              r=s.get(url,params={"upc":upc,"lang":"false"},timeout=30)
              print("\nUPC",upc,"HTTP",r.status_code,"LEN",len(r.text))
              try:
                  d=r.json()
              except Exception:
                  print(r.text[:2000]); continue
              print("TOP_KEYS",list(d.keys()))
              info=d.get("info") or {}
              print("INFO_KEYS",list(info.keys()))
              gen=info.get("generales") or {}
              print("TITULO",gen.get("titulo"))
              print("FORMATOS",json.dumps(gen.get("formatos"),ensure_ascii=False,indent=2)[:15000])
              print("MULTI",json.dumps(info.get("multiarchivos"),ensure_ascii=False,indent=2)[:30000])
          PY
