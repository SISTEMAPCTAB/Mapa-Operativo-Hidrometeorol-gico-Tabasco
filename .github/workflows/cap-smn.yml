name: Consultar avisos CAP SMN
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_cap.py'
      - '.github/workflows/cap-smn.yml'
permissions:
  contents: write
concurrency:
  group: cap-smn-map-only
  cancel-in-progress: false
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consultar fuente oficial sin tocar datos anteriores
        run: python3 scripts/collect_cap.py
      - name: Validar contrato aislado
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/cap-smn/latest.json').read_text(encoding='utf-8'))
          assert j['state'] in ('ok','unavailable','no_verified_alerts')
          assert isinstance(j['alerts'],list)
          if j['state']!='ok': assert not j['alerts']
          print('CAP:',j['state'],'avisos:',len(j['alerts']))
          PY
      - name: Publicar únicamente el estado CAP
        run: |
          set -euo pipefail
          git config user.name "Mapa CAP SMN"
          git config user.email "actions@users.noreply.github.com"
          cp data/cap-smn/latest.json /tmp/cap-smn-latest.json
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/cap-smn
            cp /tmp/cap-smn-latest.json data/cap-smn/latest.json
            git add data/cap-smn/latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualiza consulta CAP SMN [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 1
