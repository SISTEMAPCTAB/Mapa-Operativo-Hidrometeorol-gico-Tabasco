name: Construir subcuencas SMN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-smn-subcuencas.yml"
      - "data/pronostico-smn-subcuencas.json"

permissions:
  contents: write

concurrency:
  group: subcuencas-smn
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lector geoespacial
        run: pip install --quiet pyshp pyproj

      - name: Descargar polígonos oficiales INEGI 1:50 000
        run: |
          python - <<'PY'
          import json, os, re, io, zipfile, tempfile, pathlib
          import requests, shapefile
          from pyproj import CRS, Transformer

          mapping = json.load(open("data/pronostico-smn-subcuencas.json", encoding="utf-8"))
          wanted = {}
          for zone, cfg in mapping["zonas"].items():
              for sb in cfg.get("subcuencas", []):
                  wanted.setdefault(sb["codigo"], {"nombre":sb.get("nombre",sb["codigo"]), "zonas":[]})
                  wanted[sb["codigo"]]["zonas"].append(zone)

          # UPC oficiales de las cuencas RH30 que contienen las subcuencas seleccionadas.
          parents = {
              "RH30A":"702825006939",  # R. Usumacinta
              "RH30D":"702825006942",  # R. Grijalva - Villahermosa
              "RH30E":"702825006943",  # R. Grijalva - Tuxtla Gutiérrez
              "RH30F":"702825006944",  # R. Grijalva - La Concordia
              "RH30G":"702825006945",  # R. Lacantún
          }

          api="https://www.inegi.org.mx/app/api/productos/interna_v2/ficha/datos"
          host="https://www.inegi.org.mx"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 MapaOperativoIPCET/1.0","Referer":"https://www.inegi.org.mx/app/biblioteca/"})

          downloads={}
          for basin,upc in parents.items():
              r=s.get(api,params={"upc":upc,"lang":"false"},timeout=30)
              r.raise_for_status()
              d=r.json()
              for parent in (d.get("info") or {}).get("multiarchivos") or []:
                  for ch in parent.get("hijos") or []:
                      desc=ch.get("descrip") or ""
                      m=re.search(r"(RH\d{2}[A-Za-z]{2})",desc)
                      if not m: continue
                      code=m.group(1)
                      if code in wanted:
                          downloads[code]=host+(ch.get("url") or "")

          missing_urls=sorted(set(wanted)-set(downloads))
          print("URLs encontradas",len(downloads),"de",len(wanted))
          if missing_urls:
              print("Sin URL:",missing_urls)

          def geom_to_lonlat(reader, shp_path):
              prj=pathlib.Path(shp_path).with_suffix(".prj")
              transformer=None
              if prj.exists():
                  try:
                      src=CRS.from_wkt(prj.read_text(errors="ignore"))
                      if src.to_epsg()!=4326:
                          transformer=Transformer.from_crs(src,CRS.from_epsg(4326),always_xy=True)
                  except Exception as e:
                      print("PRJ no reconocido",shp_path,e)

              feats=[]
              fields=[x[0] for x in reader.fields[1:]]
              for sr in reader.iterShapeRecords():
                  geom=sr.shape.__geo_interface__
                  if geom.get("type") not in ("Polygon","MultiPolygon"):
                      continue

                  def tx_coords(obj):
                      if isinstance(obj,(list,tuple)) and len(obj)>=2 and isinstance(obj[0],(int,float)) and isinstance(obj[1],(int,float)):
                          x,y=obj[0],obj[1]
                          if transformer:
                              x,y=transformer.transform(x,y)
                          return [x,y]
                      return [tx_coords(x) for x in obj]

                  geom={"type":geom["type"],"coordinates":tx_coords(geom["coordinates"])}
                  props=dict(zip(fields,list(sr.record)))
                  feats.append((geom,props))
              return feats

          features=[]
          found=set()
          with tempfile.TemporaryDirectory() as td:
              for i,(code,url) in enumerate(downloads.items(),1):
                  print(f"[{i}/{len(downloads)}] {code}")
                  try:
                      r=s.get(url,timeout=90)
                      r.raise_for_status()
                      z=zipfile.ZipFile(io.BytesIO(r.content))
                      target=os.path.join(td,code)
                      os.makedirs(target,exist_ok=True)
                      z.extractall(target)

                      shp_files=list(pathlib.Path(target).rglob("*.shp"))
                      polygon_candidates=[]
                      for shp in shp_files:
                          try:
                              rr=shapefile.Reader(str(shp),encoding="latin1",encodingErrors="replace")
                              if rr.shapeType in (5,15,25,31): # Polygon variants
                                  polygon_candidates.append((shp,rr))
                          except Exception:
                              pass

                      if not polygon_candidates:
                          print("  SIN POLÍGONO", [p.name for p in shp_files])
                          continue

                      # Los ZIP de INEGI incluyen varias capas poligonales (_ha, etc.).
                      # La capa terminada en _subc es el límite de la subcuenca y es la que
                      # debe publicarse; no usar polígonos internos de áreas hidrográficas.
                      preferred=[x for x in polygon_candidates if "_subc" in x[0].stem.lower()]
                      if preferred:
                          shp,rr=preferred[0]
                      else:
                          # Respaldo: elegir la capa con menos entidades, normalmente el límite.
                          shp,rr=min(polygon_candidates,key=lambda x: len(x[1]))
                      polys=geom_to_lonlat(rr,shp)
                      if not polys:
                          continue

                      for geom,props in polys:
                          features.append({
                              "type":"Feature",
                              "properties":{
                                  "SUBCUE":code,
                                  "SUBCUENCA":wanted[code]["nombre"],
                                  "zonas_smn":wanted[code]["zonas"],
                                  "source":"INEGI Red Hidrográfica 1:50 000 edición 2.0"
                              },
                              "geometry":geom
                          })
                      found.add(code)
                      print("  OK",shp.name,"polígonos",len(polys))
                  except Exception as e:
                      print("  ERROR",code,repr(e))

          print("Subcuencas construidas:",len(found),sorted(found))
          print("Faltantes:",sorted(set(wanted)-found))
          if not features:
              raise SystemExit("No se pudo construir ningún polígono INEGI.")

          out={
              "type":"FeatureCollection",
              "source":"INEGI Red Hidrográfica escala 1:50 000, edición 2.0",
              "features":features
          }
          os.makedirs("data",exist_ok=True)
          with open("data/subcuencas-smn.geojson","w",encoding="utf-8") as fp:
              json.dump(out,fp,ensure_ascii=False,separators=(",",":"))
          PY

      - name: Guardar GeoJSON oficial local
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subcuencas-smn.geojson
          git diff --cached --quiet || git commit -m "Actualiza polígonos INEGI de subcuencas SMN"
          git push
