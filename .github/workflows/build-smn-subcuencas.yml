name: Construir subcuencas SMN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-smn-subcuencas.yml"
      - "data/pronostico-smn-subcuencas.json"
  schedule:
    - cron: "20 16 * * *"

permissions:
  contents: write

concurrency:
  group: subcuencas-smn
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Descargar subcuencas RH30 desde CONAGUA
        run: |
          python - <<'PY'
          import json, os, requests, datetime

          service = "https://sigagis.conagua.gob.mx/ArcGIS/rest/services/LocREPDA/MapServer/18/query"
          mapping = json.load(open("data/pronostico-smn-subcuencas.json", encoding="utf-8"))

          codes = []
          zone_by_code = {}
          for zone, cfg in mapping["zonas"].items():
              for sb in cfg.get("subcuencas", []):
                  code = sb["codigo"]
                  if code not in codes:
                      codes.append(code)
                  zone_by_code.setdefault(code, []).append(zone)

          # En esta capa CLAVE identifica la región hidrológica (RH30).
          # SUBCUE puede venir como código corto; por ello descargamos RH30 y
          # normalizamos localmente antes de seleccionar las subcuencas deseadas.
          payload = {
              "where": "CLAVE='RH30'",
              "outFields": "FID,CLAVE,RH,CVE_CUEN,CUENCA,SUBCUE,SUBCUENCA,KM2",
              "returnGeometry": "true",
              "outSR": "4326",
              "f": "json"
          }

          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 MapaOperativoIPCET/1.0"})
          r = session.post(service, data=payload, timeout=35)
          print("HTTP", r.status_code)
          r.raise_for_status()
          data = r.json()

          if data.get("error"):
              raise SystemExit("ArcGIS error: " + json.dumps(data["error"], ensure_ascii=False))

          features = []
          found = set()
          seen_raw = []
          wanted_set = set(codes)

          def normalize_code(attrs):
              raw = str(attrs.get("SUBCUE") or "").strip()
              cve = str(attrs.get("CVE_CUEN") or "").strip()
              if raw.upper().startswith("RH30"):
                  return raw
              # Este servicio separa la clave de cuenca (D) y la letra de
              # subcuenca (h): juntas forman RH30Dh.
              if len(cve)==1 and len(raw)==1:
                  return "RH30" + cve + raw
              # Respaldo para servicios que devuelvan Da, Dh, Ea, etc.
              if len(raw) in (2,3):
                  return "RH30" + raw
              return raw

          for ft in data.get("features") or []:
              attrs = ft.get("attributes") or {}
              raw = str(attrs.get("SUBCUE") or "")
              if raw and len(seen_raw)<25:
                  seen_raw.append((raw, attrs.get("CVE_CUEN"), attrs.get("SUBCUENCA")))
              code = normalize_code(attrs)
              if code not in wanted_set:
                  continue
              rings = (ft.get("geometry") or {}).get("rings") or []
              if not rings:
                  continue
              found.add(code)
              props = dict(attrs)
              props["SUBCUE_CANON"] = code
              features.append({
                  "type":"Feature",
                  "properties": {
                      **props,
                      "zonas_smn": zone_by_code.get(code, [])
                  },
                  "geometry":{
                      "type":"Polygon",
                      "coordinates":rings
                  }
              })

          print("Muestras SUBCUE:", seen_raw)
          print("Solicitadas:", len(codes), "Encontradas:", len(found))
          print("Faltantes:", sorted(set(codes)-found))

          if not features:
              raise SystemExit("CONAGUA no devolvió geometrías.")

          out = {
              "type":"FeatureCollection",
              "source":"CONAGUA SIGA / INEGI Cuencas 250 000",
              "generated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "requested_codes":codes,
              "found_codes":sorted(found),
              "features":features
          }
          os.makedirs("data", exist_ok=True)
          with open("data/subcuencas-smn.geojson","w",encoding="utf-8") as fp:
              json.dump(out,fp,ensure_ascii=False,separators=(",",":"))
          PY

      - name: Guardar GeoJSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subcuencas-smn.geojson
          git diff --cached --quiet || git commit -m "Actualiza geometrías locales de subcuencas SMN"
          git push
